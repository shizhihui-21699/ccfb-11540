[package]
name = "mb-attest"
version = "0.1.0"
edition = "2021"
description = "Measured-boot remote attestation verifier: TCG crypto-agile event log replay, TPM quote verification, trusted-baseline diff"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
pkcs8 = { version = "0.10", features = ["pem", "std"] }
rand = "0.8"
rsa = { version = "0.9", features = ["sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
