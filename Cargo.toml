[package]
name = "tpm-ra-verify"
version = "0.1.0"
edition = "2021"
description = "Parse TCG measured boot event logs, replay PCRs, verify TPM quotes against a trusted baseline"
license = "MIT"

[lib]
name = "tpm_ra_verify"
path = "src/lib.rs"

[[bin]]
name = "tpm-ra-verify"
path = "src/main.rs"

[[bin]]
name = "gen-samples"
path = "src/bin/gen-samples.rs"

[dependencies]
sha1 = "0.10"
# The `oid` feature supplies the `AssociatedOid` impls required by
# rsa::pkcs1v15::{SigningKey,VerifyingKey} for SHA-256/384/512.
sha2 = { version = "0.10", features = ["oid"] }
rsa = { version = "0.9", default-features = false, features = ["std", "pem"] }
p256 = { version = "0.13", features = ["pem", "digest"] }
pkcs8 = { version = "0.10", features = ["pem", "alloc"] }
signature = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }

[dev-dependencies]
tempfile = "3"
